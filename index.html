<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last Man Standing</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        h1, h2 { color: #1a1a1a; margin-bottom: 16px; }
        h1 { font-size: 28px; }
        h2 { font-size: 20px; margin-top: 24px; }
        
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 1px solid #ddd;
            align-items: center;
        }
        .tab-btn {
            padding: 12px 16px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }
        .tab-btn.active {
            color: #0066cc;
            border-bottom-color: #0066cc;
        }
        .tab-btn:hover { color: #333; }
        
        .admin-tab-btn {
            display: none;
        }
        
        #loginBtn {
            margin-left: auto;
        }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .form-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-weight: 500;
            color: #1a1a1a;
            font-size: 14px;
        }
        input, select, textarea {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 2px rgba(0, 102, 204, 0.1);
        }
        
        button {
            padding: 10px 16px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }
        button:hover { background: #0052a3; }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .secondary-btn {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
        }
        .secondary-btn:hover { background: #e0e0e0; }
        
        .section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #eee;
        }
        
        .fixture {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto auto;
            gap: 12px;
            align-items: end;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 6px;
            margin-bottom: 12px;
            border: 1px solid #eee;
        }
        .fixture-header {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto auto;
            gap: 12px;
            font-weight: 600;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #ddd;
        }
        
        .entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: white;
            border-radius: 6px;
            border: 1px solid #eee;
            margin-bottom: 12px;
        }
        .entry.eliminated { opacity: 0.6; }
        .entry.eliminated::before {
            content: "❌ ";
            color: #e74c3c;
            font-weight: bold;
        }
        
        .entry-info { flex: 1; }
        .entry-name { font-weight: 500; }
        .entry-details { font-size: 13px; color: #666; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            padding: 16px;
            border-radius: 6px;
            border: 1px solid #eee;
            text-align: center;
        }
        .stat-value { font-size: 24px; font-weight: 600; color: #0066cc; }
        .stat-label { font-size: 12px; color: #666; margin-top: 4px; }
        
        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
        }
        .alert-danger {
            background: #fdeaea;
            color: #c33;
            border: 1px solid #f5c6c6;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .result-buttons {
            display: flex;
            gap: 6px;
        }
        .result-buttons button {
            flex: 1;
            padding: 6px 12px;
            font-size: 12px;
        }
        
        @media print {
            body { background: white; }
            .no-print { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚽ Last Man Standing</h1>
        
        <div class="tabs no-print">
            <button class="tab-btn admin-tab-btn" data-tab="admin">Admin</button>
            <button class="tab-btn active" data-tab="player">Player Entry</button>
            <button class="tab-btn" data-tab="standings">Standings</button>
            <button class="tab-btn secondary-btn" id="loginBtn" onclick="showLoginPrompt()">🔐 Admin Login</button>
        </div>

        <!-- ADMIN TAB -->
        <div class="tab-content" id="admin">
            <div class="section">
                <h2>Gameweek Setup</h2>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Gameweek Number</label>
                        <input type="number" id="gameweekNum" value="1" min="1">
                    </div>
                    <div class="form-group">
                        <label>First Kickoff Time (entry closes 90 mins before)</label>
                        <input type="datetime-local" id="firstKickoff">
                    </div>
                </div>
                <div class="form-group">
                    <label>Add Fixture</label>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 8px;">
                        <input type="text" id="homeTeam" placeholder="Home team">
                        <input type="text" id="awayTeam" placeholder="Away team">
                        <input type="datetime-local" id="kickoffTime">
                        <button onclick="addFixture()">Add</button>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>Fixtures & Results</h2>
                <div id="fixturesList"></div>
            </div>

            <div class="section">
                <h2>Export & Actions</h2>
                <div class="button-group">
                    <button onclick="generatePDF()">📥 Download PDF of All Picks</button>
                    <button class="secondary-btn" onclick="resetGameweek()">Reset Current Gameweek</button>
                    <button class="secondary-btn" onclick="clearAllData()">Clear All Data</button>
                </div>
            </div>
        </div>

        <!-- PLAYER TAB -->
        <div class="tab-content active" id="player">
            <div class="section">
                <div id="entryStatus"></div>
                <div id="playerForm"></div>
            </div>
        </div>

        <!-- STANDINGS TAB -->
        <div class="tab-content" id="standings">
            <div class="section">
                <h2>Current Status</h2>
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-value" id="totalPlayers">0</div>
                        <div class="stat-label">Total players</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="playersIn">0</div>
                        <div class="stat-label">Still in</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="playersOut">0</div>
                        <div class="stat-label">Eliminated</div>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>Entries This Gameweek</h2>
                <div id="entriesList"></div>
            </div>
        </div>
    </div>

    <script>
        const DB_KEY = 'lastManStanding';
        const ADMIN_PASSWORD = '727727';

        function isAdminLoggedIn() {
            return sessionStorage.getItem('adminLoggedIn') === 'true';
        }

        function showLoginPrompt() {
            const password = prompt('Enter admin password:');
            if (password === ADMIN_PASSWORD) {
                sessionStorage.setItem('adminLoggedIn', 'true');
                document.querySelector('.admin-tab-btn').style.display = 'block';
                document.getElementById('loginBtn').style.display = 'none';
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.querySelector('.admin-tab-btn').classList.add('active');
                document.getElementById('admin').classList.add('active');
            } else if (password !== null) {
                alert('❌ Incorrect password');
            }
        }

        window.addEventListener('load', function() {
            if (isAdminLoggedIn()) {
                document.querySelector('.admin-tab-btn').style.display = 'block';
                document.getElementById('loginBtn').style.display = 'none';
            }
            render();
            setInterval(render, 1000);
        });

        function getData() {
            const data = localStorage.getItem(DB_KEY);
            return data ? JSON.parse(data) : { gameweeks: {}, entries: [], eliminated: [] };
        }

        function saveData(data) {
            localStorage.setItem(DB_KEY, JSON.stringify(data));
            setTimeout(() => render(), 100);
        }

        function addFixture() {
            const home = document.getElementById('homeTeam').value.trim();
            const away = document.getElementById('awayTeam').value.trim();
            const kickoff = document.getElementById('kickoffTime').value;
            const firstKickoff = document.getElementById('firstKickoff').value;

            if (!home || !away || !kickoff) {
                alert('Please fill in all fields');
                return;
            }
            if (!firstKickoff) {
                alert('Please set the first kickoff time first');
                return;
            }

            const data = getData();
            const gw = parseInt(document.getElementById('gameweekNum').value);
            const gwKey = 'gw' + gw;
            
            if (!data.gameweeks[gwKey]) {
                data.gameweeks[gwKey] = { number: gw, fixtures: [], firstKickoff: firstKickoff };
            }

            data.gameweeks[gwKey].fixtures.push({ home, away, kickoff, result: null });
            saveData(data);
            document.getElementById('homeTeam').value = '';
            document.getElementById('awayTeam').value = '';
            document.getElementById('kickoffTime').value = '';
        }

        function setResult(gwNum, fixtureIdx, result) {
            const data = getData();
            const gwKey = 'gw' + gwNum;
            
            if (!data.gameweeks[gwKey]) return;
            
            data.gameweeks[gwKey].fixtures[fixtureIdx].result = result;

            const fixture = data.gameweeks[gwKey].fixtures[fixtureIdx];
            data.entries.forEach(entry => {
                if (entry.gameweek === gwNum) {
                    const picked = entry.pick;
                    let isEliminated = false;

                    if (result === 'home' && picked !== fixture.home) isEliminated = true;
                    if (result === 'away' && picked === fixture.home) isEliminated = true;

                    if (isEliminated && !data.eliminated.includes(entry.id)) {
                        data.eliminated.push(entry.id);
                    }
                }
            });

            saveData(data);
        }

        function submitEntry() {
            const name = document.getElementById('playerName').value.trim();
            const email = document.getElementById('playerEmail').value.trim();
            const pick = document.getElementById('teamPick').value;

            if (!name || !email || !pick) {
                alert('Please fill in all fields');
                return;
            }

            if (!email.includes('@')) {
                alert('Please enter a valid email');
                return;
            }

            const data = getData();
            const gw = parseInt(document.getElementById('gameweekNum').value);
            const entryId = Date.now() + Math.random();

            data.entries.push({ id: entryId, name, email, pick, gameweek: gw, timestamp: new Date().toISOString() });
            saveData(data);
            document.getElementById('playerName').value = '';
            document.getElementById('playerEmail').value = '';
            document.getElementById('teamPick').value = '';
            alert('✓ Entry submitted! Good luck!');
        }

        function resetGameweek() {
            if (confirm('Reset current gameweek? This will clear all entries and fixtures.')) {
                const data = getData();
                const gw = parseInt(document.getElementById('gameweekNum').value);
                const gwKey = 'gw' + gw;
                if (data.gameweeks[gwKey]) {
                    delete data.gameweeks[gwKey];
                    data.entries = data.entries.filter(e => e.gameweek !== gw);
                    saveData(data);
                }
            }
        }

        function clearAllData() {
            if (confirm('CLEAR ALL DATA? This cannot be undone.')) {
                localStorage.removeItem(DB_KEY);
                render();
            }
        }

        function generatePDF() {
            const data = getData();
            const gw = parseInt(document.getElementById('gameweekNum').value);
            const entries = data.entries.filter(e => e.gameweek === gw);

            if (entries.length === 0) {
                alert('No entries to export');
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let y = 20;

            doc.setFontSize(16);
            doc.text('Last Man Standing - Gameweek ' + gw + ' Picks', 20, y);
            y += 15;

            doc.setFontSize(10);
            doc.text('Generated: ' + new Date().toLocaleString(), 20, y);
            y += 10;

            doc.setFontSize(11);
            doc.setFont(undefined, 'bold');
            doc.text('Name', 20, y);
            doc.text('Email', 80, y);
            doc.text('Team Pick', 140, y);
            doc.text('Status', 180, y);
            y += 10;

            doc.setFont(undefined, 'normal');
            doc.setFontSize(9);

            entries.forEach(entry => {
                const eliminated = data.eliminated.includes(entry.id) ? 'OUT' : 'IN';
                doc.text(entry.name, 20, y);
                doc.text(entry.email, 80, y);
                doc.text(entry.pick, 140, y);
                doc.setTextColor(eliminated === 'OUT' ? 192, 0, 0 : 0, 128, 0);
                doc.text(eliminated, 180, y);
                doc.setTextColor(0);
                y += 8;
                if (y > 280) {
                    doc.addPage();
                    y = 20;
                }
            });

            doc.save('LMS_GW' + gw + '_Picks.pdf');
        }

        function render() {
            try {
                const data = getData();
                const gw = parseInt(document.getElementById('gameweekNum').value);
                const gwKey = 'gw' + gw;
                const gwData = data.gameweeks[gwKey];
                const entries = data.entries.filter(e => e.gameweek === gw);
                const entriesIn = entries.filter(e => !data.eliminated.includes(e.id));
                const entriesOut = entries.filter(e => data.eliminated.includes(e.id));

                const fixturesList = document.getElementById('fixturesList');
                if (gwData && gwData.fixtures && gwData.fixtures.length > 0) {
                    let html = '<div class="fixture-header"><div>Home</div><div>Away</div><div>Kickoff</div><div>Result</div><div></div></div>';
                    gwData.fixtures.forEach((f, i) => {
                        html += '<div class="fixture ' + (f.result ? 'result-set' : '') + '">';
                        html += '<div>' + f.home + '</div>';
                        html += '<div>' + f.away + '</div>';
                        html += '<div style="font-size: 13px; color: #666;">' + new Date(f.kickoff).toLocaleString() + '</div>';
                        html += '<div class="result-buttons">';
                        html += '<button onclick="setResult(' + gw + ', ' + i + ', \'home\')" style="background: ' + (f.result === 'home' ? '#27ae60' : '#e0e0e0') + '; color: ' + (f.result === 'home' ? 'white' : '#333') + ';">HW</button>';
                        html += '<button onclick="setResult(' + gw + ', ' + i + ', \'away\')" style="background: ' + (f.result === 'away' ? '#27ae60' : '#e0e0e0') + '; color: ' + (f.result === 'away' ? 'white' : '#333') + ';">AD</button>';
                        html += '</div></div>';
                    });
                    fixturesList.innerHTML = html;
                } else {
                    fixturesList.innerHTML = '<p style="color: #999;">No fixtures added yet</p>';
                }

                const playerForm = document.getElementById('playerForm');
                const entryStatus = document.getElementById('entryStatus');
                const now = new Date();
                const closeTime = gwData && gwData.firstKickoff ? new Date(new Date(gwData.firstKickoff).getTime() - 90 * 60000) : null;
                const isOpen = !closeTime || now < closeTime;

                if (!isOpen) {
                    entryStatus.innerHTML = '<div class="alert alert-danger">❌ Entry is closed (closes 90 minutes before first match)</div>';
                    playerForm.innerHTML = '';
                } else {
                    entryStatus.innerHTML = '<div class="alert alert-info">✓ Entry open' + (closeTime ? ' until ' + closeTime.toLocaleString() : '') + '</div>';
                    
                    const teams = new Set();
                    if (gwData && gwData.fixtures) {
                        gwData.fixtures.forEach(f => {
                            teams.add(f.home);
                            teams.add(f.away);
                        });
                    }

                    let formHtml = '<div style="max-width: 400px;"><div class="form-group"><label>Your Name</label><input type="text" id="playerName" placeholder="e.g. John Smith"></div>';
                    formHtml += '<div class="form-group"><label>Email</label><input type="email" id="playerEmail" placeholder="your@email.com"></div>';
                    formHtml += '<div class="form-group"><label>Pick a team (home team wins OR away team draws/wins)</label><select id="teamPick"><option value="">-- Select team --</option>';
                    Array.from(teams).sort().forEach(t => {
                        formHtml += '<option value="' + t + '">' + t + '</option>';
                    });
                    formHtml += '</select></div>';
                    formHtml += '<button onclick="submitEntry()">Submit Entry</button>';
                    if (entries.length > 0) {
                        formHtml += '<p style="margin-top: 12px; font-size: 13px; color: #666;">' + entries.length + ' entries so far this gameweek</p>';
                    }
                    formHtml += '</div>';
                    playerForm.innerHTML = formHtml;
                }

                document.getElementById('totalPlayers').textContent = entries.length;
                document.getElementById('playersIn').textContent = entriesIn.length;
                document.getElementById('playersOut').textContent = entriesOut.length;

                const entriesList = document.getElementById('entriesList');
                if (entries.length > 0) {
                    let entriesHtml = '';
                    entries.forEach(e => {
                        const statusText = data.eliminated.includes(e.id) ? 'ELIMINATED' : 'IN';
                        const statusColor = data.eliminated.includes(e.id) ? '#e74c3c' : '#27ae60';
                        entriesHtml += '<div class="entry ' + (data.eliminated.includes(e.id) ? 'eliminated' : '') + '">';
                        entriesHtml += '<div class="entry-info"><div class="entry-name">' + e.name + '</div>';
                        entriesHtml += '<div class="entry-details">' + e.email + ' • Picked: <strong>' + e.pick + '</strong></div></div>';
                        entriesHtml += '<div style="text-align: right; font-weight: 500; color: ' + statusColor + ';">' + statusText + '</div>';
                        entriesHtml += '</div>';
                    });
                    entriesList.innerHTML = entriesHtml;
                } else {
                    entriesList.innerHTML = '<p style="color: #999;">No entries yet</p>';
                }
            } catch (err) {
                console.error('Render error:', err);
            }
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                if (this.dataset.tab === 'admin' && !isAdminLoggedIn()) {
                    showLoginPrompt();
                    return;
                }
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                document.getElementById(this.dataset.tab).classList.add('active');
            });
        });

        if (!localStorage.getItem(DB_KEY)) {
            localStorage.setItem(DB_KEY, JSON.stringify({ gameweeks: {}, entries: [], eliminated: [] }));
        }
    </script>
</body>
</html>
